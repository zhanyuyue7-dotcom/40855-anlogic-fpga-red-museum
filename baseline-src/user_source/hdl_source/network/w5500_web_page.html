<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>瞬应音画终端</title><style>body{margin:0;padding:12px;background:#0a0e1a;color:#e0e6ed;font:14px Arial,sans-serif}main{max-width:520px;margin:auto}header,.box{border:1px solid #2d3548;background:#111827;border-radius:6px;padding:12px;margin-bottom:10px}h1{margin:0 0 6px;color:#00d9ff;font-size:20px}#s{color:#8be9b0;margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}h2{font-size:14px;color:#9aa8bd;margin:0 0 8px}button{min-height:38px;border:1px solid #39465e;border-radius:5px;background:#1a2333;color:#e0e6ed;font-size:14px}button:active{background:#00d9ff;color:#081018}button:disabled{opacity:.38}.warn{border-color:#8f3c4c}.muted{color:#8b98aa;font-size:12px}</style><main><header><h1>瞬应音画终端</h1><p id="s">网页已加载</p></header><section class="box"><h2>图片控制</h2><div class="grid"><button disabled>上一张</button><button onclick="c('n')">下一张</button><button onclick="c('a')">轮播开/关</button><button disabled>停止轮播</button></div><p class="muted">切换图片会触发柔和转场</p></section><section class="box"><h2>场景控制</h2><div class="grid"><button onclick="c('p')">提示</button><button onclick="c('x')">清除</button><button class="warn" onclick="c('e')">紧急</button><button disabled>普通</button></div></section><section class="box"><h2>亮度控制</h2><div class="grid"><button onclick="c('u')">亮度增加</button><button onclick="c('d')">亮度降低</button><button disabled>25%</button><button disabled>50% / 75% / 100%</button></div></section><section class="box"><h2>音频与显示</h2><div class="grid"><button onclick="c('m')">音频开关</button><button onclick="c('v')">UI/频谱切换</button></div></section></main><script>function c(x){fetch('/c/'+x).then(()=>s.textContent='命令已发送：'+x).catch(()=>s.textContent='发送失败：'+x)}</script>
